name: release

# A tag (2026.11.12, or 2026.11.12.1 for a second one the same day) publishes the catalog: the
# bundles Caravana fetches, catalog.v2.json (format 2) and catalog.json (format 1, which Caravana
# 0.22 and older read and which must stay readable by them), and SHA256SUMS beside them. Caravana reads the latest
# release's files, once a day, and keeps the catalog only when its version is newer than the one it has.
on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]", "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*"]

permissions:
  contents: write

env:
  # As in ci.yml: the Caravana release whose `template` command checks and bundles the catalog.
  # The first release with catalog format 2 (feature 058): older ones can't read the templates.
  CARAVANA_REF: v0.24.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Bundle
        run: |
          go run github.com/cosmic-chimps/caravana/cmd/caravana@${CARAVANA_REF} \
            template bundle --version "${GITHUB_REF_NAME}" . dist
          cat dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/catalog.v2.json dist/catalog.json dist/SHA256SUMS \
            --title "Catalog ${GITHUB_REF_NAME}" \
            --notes "The template catalog ${GITHUB_REF_NAME}: catalog.v2.json (format 2), catalog.json (format 1, for Caravana 0.22 and older) and their SHA256SUMS."
